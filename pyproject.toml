[project]
name = "projet-7"
version = "0.1.0"
description = "Concevez et déployez un système RAG"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [    
    "logging>=0.4.9.6",    
    "numpy>=2.5.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
]   

[project.optional-dependencies]
rag = [
    "torch",    
    "beautifulsoup4>=4.15.0",
    "faiss-cpu>=1.15.0",
    "langchain>=1.3.18",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "mistral>=22.0.0",
]

api = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]
client = [
    "requests>=2.34.2",
    "streamlit>=1.63.0",
]

[dependency-groups]
dev = [
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "openai>=3.3.0",
    "deepeval>=4.2.3",
]


[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
